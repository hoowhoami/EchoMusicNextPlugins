name: Third-party plugin publications
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check-publications:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ./.github/actions/setup-qt
      - run: npm ci --ignore-scripts
      - run: npm run check:published:third-party
