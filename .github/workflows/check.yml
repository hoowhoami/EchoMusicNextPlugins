name: Plugin SDK and packages
on: workflow_dispatch
permissions:
  contents: read
jobs:
  shader-packs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            backend: windows
            tool: Release/echo-plugin-shader-pack.exe
          - os: macos-15
            backend: macos
            tool: echo-plugin-shader-pack
          - os: ubuntu-22.04
            backend: linux
            tool: echo-plugin-shader-pack
    runs-on: ${{ matrix.os }}
    env:
      ECHO_SHADER_PACK_TOOL: ${{ github.workspace }}/build/shader-tool/${{ matrix.tool }}
      MACOSX_DEPLOYMENT_TARGET: '14.4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtshadertools'
      - name: Select the Metal compiler
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_16.4.app ]]; then
            echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
            /Applications/Xcode_16.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/metal --version
          else
            xcrun metal --version || xcodebuild -downloadComponent metalToolchain
          fi
      - name: Locate FXC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$compiler) { throw 'Windows SDK FXC compiler is required' }
          "ECHO_FXC=$($compiler.FullName)" >> $env:GITHUB_ENV
      - run: npm ci --ignore-scripts
      - name: Build the Qt shader pack tool
        shell: bash
        run: |
          cmake -S packages/tools/native/shader-pack -B build/shader-tool -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(qtpaths --query QT_INSTALL_PREFIX)"
          cmake --build build/shader-tool --config Release --parallel 4
      - run: node scripts/precompile-plugin-shaders.mjs stage plugins/folia-lyrics-skin --backend ${{ matrix.backend }} --out build/native-${{ matrix.backend }}
      - uses: actions/upload-artifact@v4
        with:
          name: folia-native-${{ matrix.backend }}
          path: build/native-${{ matrix.backend }}
          if-no-files-found: error
  merge-shaders:
    needs: shader-packs
    runs-on: ubuntu-22.04
    env:
      ECHO_SHADER_PACK_TOOL: ${{ github.workspace }}/build/shader-tool/echo-plugin-shader-pack
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtshadertools'
      - run: npm ci --ignore-scripts
      - shell: bash
        run: |
          cmake -S packages/tools/native/shader-pack -B build/shader-tool -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(qtpaths --query QT_INSTALL_PREFIX)"
          cmake --build build/shader-tool --config Release --parallel 4
      - uses: actions/download-artifact@v4
        with:
          pattern: folia-native-*
          path: build/native-stages
      - run: node scripts/precompile-plugin-shaders.mjs merge --windows build/native-stages/folia-native-windows --macos build/native-stages/folia-native-macos --linux build/native-stages/folia-native-linux --out build/portable-packs/folia-lyrics-skin
      - uses: actions/upload-artifact@v4
        with:
          name: folia-precompiled-shaders
          path: build/portable-packs
          if-no-files-found: error
  check:
    needs: merge-shaders
    env:
      ECHO_NATIVE_SHADER_PACKS: ${{ github.workspace }}/build/portable-packs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtshadertools'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: folia-precompiled-shaders
          path: build/portable-packs
      - name: Build the native shader import verifier
        shell: bash
        run: |
          cmake -S packages/tools/native/shader-pack -B build/shader-tool -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(qtpaths --query QT_INSTALL_PREFIX)"
          cmake --build build/shader-tool --config Release --parallel 4
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "ECHO_SHADER_PACK_TOOL=$GITHUB_WORKSPACE/build/shader-tool/Release/echo-plugin-shader-pack.exe" >> "$GITHUB_ENV"
          else
            echo "ECHO_SHADER_PACK_TOOL=$GITHUB_WORKSPACE/build/shader-tool/echo-plugin-shader-pack" >> "$GITHUB_ENV"
          fi
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:published
