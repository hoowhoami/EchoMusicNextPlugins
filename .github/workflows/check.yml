name: Plugin SDK and packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            source/folia-reference/package-lock.json
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtshadertools'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix source/folia-reference --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:published
